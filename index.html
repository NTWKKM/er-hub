<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNRH-ED Standing Order Hub — Maharat Nakhon Ratchasima Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/base.css">
    
    <script>
        // Backward Compatibility Redirection Logic
        // Redirects old URLs/bookmarks/QR codes that pointed to index.html with inputs or hash
        if (
            window.location.search.includes('order=rtpa') || 
            window.location.hash.includes('rtpa') ||
            window.location.search.includes('hn=') || 
            window.location.search.includes('weight=')
        ) {
            window.location.replace('orders/rtpa.html' + window.location.search + window.location.hash);
        }
    </script>

    <style>
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            display: block;
        }

        .portal-container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .portal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 32px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.25);
            margin-bottom: 30px;
        }

        .portal-header svg {
            flex-shrink: 0;
        }

        .portal-header-text {
            text-align: left;
        }

        .portal-header-text h1 {
            font-size: 1.8em;
            margin: 0;
            font-weight: 700;
            line-height: 1.2;
        }

        .portal-header-text p {
            margin: 4px 0 0 0;
            font-size: 14px;
            opacity: 0.85;
        }

        .grid-section-title {
            font-size: 1.35em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-left: 5px solid #2a5298;
            padding-left: 10px;
            margin-top: 30px;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .portal-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 18px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.25s ease-in-out;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: space-between;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            border-color: #2a5298;
        }

        .card-header-block {
            margin-bottom: 0;
        }

        .card-icon {
            font-size: 1.8em;
            margin-bottom: 6px;
            display: inline-block;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e3c72;
            margin: 0;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            width: 100%;
        }

        .btn-card-print-blank {
            background: #fff;
            border: 1px solid #2a5298;
            color: #2a5298;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-card-print-blank:hover {
            background: #2a5298;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="portal-container">

        </a>

        <!-- Massive PE -->

            </div>
        </a>
    </div>

    <!-- Central Tools Section -->
    <div class="grid-section-title">🛠️ เครื่องมือกลาง (Reference Tools)</div>
    <div class="portal-grid">
        <!-- IV Drip Calculator -->
        <a href="tools/drip-calculator.html" class="portal-card">

                <span class="card-icon">🧪</span>
                <h4 class="card-title">IV Infusion Drip Calculator</h4>
            </div>
        </a>
    </div>
</div>

<script>
function printBlankOrder(orderName) {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = `orders/${orderName}.html?print-blank-direct=true`;
    iframe.onload = () => {
        // Give the iframe time to render, then trigger print
        setTimeout(() => {
            iframe.contentWindow.print();
        }, 500);
    };
    document.body.appendChild(iframe);
    // Clean up after print dialog closes
    setTimeout(() => {
        document.body.removeChild(iframe);
    }, 60000);
}
</script>

</body>
</html>
