<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNRH-ED Standing Order Hub — Maharat Nakhon Ratchasima Hospital</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/base.css">
    
    <script>
        // Backward Compatibility Redirection Logic
        // Redirects old URLs/bookmarks/QR codes that pointed to index.html with inputs or hash
        if (
            window.location.search.includes('order=rtpa') || 
            window.location.hash.includes('rtpa') ||
            window.location.search.includes('hn=') || 
            window.location.search.includes('weight=')
        ) {
            window.location.replace('orders/rtpa.html' + window.location.search + window.location.hash);
        }
    </script>

    <style>
        body {
            /* index.html builds its own layout via .portal-container, so body
               itself carries no padding — but --page-pad must still be set to 0
               here, since shared/base.css's .top-nav breakout math (used by
               injectNavBar) reads this var to compute how far to negative-margin
               itself flush. Leaving this at the default 20px (as in base.css)
               caused the nav to overflow 20px past the viewport on each side,
               specifically on this page. */
            --page-pad: 0px;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            display: block;
        }

        .portal-container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .portal-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-left-width: 4px;
            border-radius: 8px;
            padding: 18px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.25s ease-in-out;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 17px;
            font-weight: bold;
            margin: 0;
            line-height: 1.3;
        }

        /* Category border colors */
        .cat-cardiac   { border-left-color: #c0392b; }
        .cat-pulmonary { border-left-color: #2980b9; }
        .cat-neuro     { border-left-color: #8e44ad; }
        .cat-anticoag  { border-left-color: #16a085; }
        .cat-tox       { border-left-color: #d35400; }
        .cat-procedural{ border-left-color: #27ae60; }
        .cat-tools     { border-left-color: #2c3e50; }

        /* Tablet responsive */
        @media (max-width: 900px) and (min-width: 600px) {
            .portal-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 599px) {
            .portal-container { margin: 16px auto; padding: 0 12px; }
            .portal-grid { grid-template-columns: 1fr; gap: 10px; }
            .portal-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>

<div class="portal-container">
    <!-- Header removed — nav bar replaces portal header -->

    <div class="portal-grid">
        <!-- STROKE FAST TRACK (first) -->
        <a href="orders/rtpa.html" class="portal-card cat-neuro">
            <h4 class="card-title">rt-PA Stroke FAST TRACK</h4>
        </a>
        <!-- CARDIAC -->
        <a href="orders/stemi.html" class="portal-card cat-cardiac">
            <h4 class="card-title">STEMI Standing Order</h4>
        </a>
        <a href="orders/nstemi.html" class="portal-card cat-cardiac">
            <h4 class="card-title">NSTEMI Standing Order</h4>
        </a>
        <!-- PULMONARY -->
        <a href="orders/pe.html" class="portal-card cat-pulmonary">
            <h4 class="card-title">Massive PE Fibrinolysis</h4>
        </a>
        <!-- ANTICOAGULATION -->
        <a href="orders/heparin.html" class="portal-card cat-anticoag">
            <h4 class="card-title">Heparin Protocol</h4>
        </a>
        <!-- TOXICOLOGY -->
        <a href="orders/antivenom.html" class="portal-card cat-tox">
            <h4 class="card-title">Antivenom Standing Order</h4>
        </a>
        <!-- PROCEDURAL -->
        <a href="orders/sedation.html" class="portal-card cat-procedural">
            <h4 class="card-title">Post-Intubation Sedation</h4>
        </a>
        <!-- TOOLS -->
        <a href="tools/drip-calculator.html" class="portal-card cat-tools">
            <h4 class="card-title">IV Infusion Drip Calculator</h4>
        </a>
    </div>
</div>

<script src="shared/components.js"></script>
<script>
ED_COMPONENTS.injectNavBar('index.html', 'docs/Logo_of_Maharat_Nakhon_Ratchasima-removebg-preview.png', '');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function(e) { console.warn('SW registration failed:', e); });
}
</script>

</body>
</html>
