<html lang="th">
<head>
<meta charset="UTF-8">

<title>Eye Injury — ER NOTE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="er-note.css">
</head>
<body>
<nav class="top-nav" role="navigation">
  <div class="nav-left">
    <img src="../../docs/Logo_of_Maharat_Nakhon_Ratchasima-removebg-preview.png" alt="MNRH Logo" class="nav-logo">
    <span class="nav-title">ER NOTE</span>
  </div>
  <a href="../../index.html" class="nav-home">← Home</a>
</nav>
<div class="tab-bar" role="tablist">
  <a href="general-er-note.html">General ER Note</a>
  <a href="sepsis.html">Sepsis</a>
  <a href="trauma.html">Trauma</a>

  <a href="chest-pain.html">Chest Pain</a>
  <a href="abdominal-pain.html">Abdominal Pain</a>
  <a href="eye-injury.html">Eye Injury</a>
</div>
<main class="main">
<form id="er-form">

<div class="card">
  <h2 class="section-title"><span class="num">1</span>Mechanism & History</h2>
  <div class="field-row"><label>Mechanism</label>
    <select id="eye-mech">
      <option value="">— select —</option>
      <option>Foreign body / dust</option>
      <option>Blunt trauma</option>
      <option>Penetrating / laceration</option>
      <option>Chemical splash</option>
      <option>Flash / UV burn</option>
      <option>Other</option>
    </select>
  </div>
  <div class="field-row"><label>Chemical agent</label><input type="text" id="eye-chemical"></div>
  <div class="field-row"><label>Time since injury</label><input type="text" id="eye-time"></div>
  <div class="field-row"><label>Use of eye protection</label><input type="text" id="eye-protection"></div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">2</span>Visual Acuity</h2>
  <div class="inline-row">
    <div class="field-row"><label>Right eye</label><input type="text" id="eye-va-r" placeholder="6/60, CF, HM, LP, NLP"></div>
    <div class="field-row"><label>Left eye</label><input type="text" id="eye-va-l" placeholder="6/6"></div>
    <div class="field-row"><label>With pinhole?</label><input type="text" id="eye-pinhole"></div>
  </div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">3</span>Eye Examination</h2>
  <div class="field-row"><label>Lids / adnexa</label><textarea id="eye-lids"></textarea></div>
  <div class="field-row"><label>Conjunctiva / Sclera</label><textarea id="eye-conj"></textarea></div>
  <div class="field-row"><label>Cornea</label><textarea id="eye-cornea" placeholder="FB, abrasion, laceration, Seidel"></textarea></div>
  <div class="field-row"><label>Anterior chamber</label><input type="text" id="eye-ac" placeholder="deep / shallow / hyphema"></div>
  <div class="field-row"><label>Pupil / Iris</label><textarea id="eye-pupil"></textarea></div>
  <div class="field-row"><label>Lens / Fundus (if viewable)</label><textarea id="eye-fundus"></textarea></div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">4</span>Management</h2>
  <div class="field-row"><label>Irrigation <span class="sub">for chemical exposure</span></label><input type="text" id="eye-irrigate" placeholder="Normal saline / LR, ≥30 min, pH check"></div>
  <div class="field-row"><label>Medications</label><textarea id="eye-meds" placeholder="Topical anesthetic, fluorescein, cycloplegic, antibiotic ointment"></textarea></div>
  <div class="field-row"><label>Tetanus</label><input type="text" id="eye-tetanus"></div>
  <div class="field-row"><label>Consult / disposition</label><input type="text" id="eye-consult" placeholder="Ophthalmology if penetrating, chemical, hyphema, vision loss"></div>
</div>

</form>
</main>
<div class="action-bar">
  <button type="button" class="btn btn-secondary" id="copy-btn" onclick="copyNote()">📋 Copy Note</button>
  <button type="button" class="btn btn-danger" onclick="clearNote()">🗑 Clear</button>
  <button type="button" class="btn btn-primary" onclick="printNote()">🖨 Print</button>
</div>
<footer class="footer">Maharat Nakhon Ratchasima Hospital · Emergency Department · v21</footer>
<script src="er-note.js"></script>
</body>
</html>
