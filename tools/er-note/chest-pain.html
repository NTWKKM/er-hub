<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chest Pain — ER NOTE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="er-note.css">
</head>
<body>
<nav class="top-nav" role="navigation">
  <div class="nav-left">
    <img src="../../docs/Logo_of_Maharat_Nakhon_Ratchasima-removebg-preview.png" alt="MNRH Logo" class="nav-logo">
    <span class="nav-title">ER NOTE</span>
  </div>
  <a href="../../index.html" class="nav-home">← Home</a>
</nav>
<div class="tab-bar" role="tablist">
  <a href="general-er-note.html">General ER Note</a>
  <a href="sepsis.html">Sepsis</a>
  <a href="trauma.html">Trauma</a>

  <a href="abdominal-pain.html">Abdominal Pain</a>
  <a href="eye-injury.html">Eye Injury</a>
</div>
<main class="main">
<form id="er-form">

<div class="card">
  <h2 class="section-title"><span class="num">1</span>Chest Pain Character</h2>
  <div class="field-row"><label>Onset & duration</label><input type="text" id="chest-onset"></div>
  <div class="field-row"><label>Character</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chest-pressure"> Pressure / squeezing</label>
      <label><input type="checkbox" id="chest-tearing"> Tearing / ripping</label>
      <label><input type="checkbox" id="chest-pleuritic"> Pleuritic</label>
      <label><input type="checkbox" id="chest-positional"> Positional / reproducible</label>
    </div>
  </div>
  <div class="field-row"><label>Radiation</label><input type="text" id="chest-radiation"></div>
  <div class="field-row"><label>Associated symptoms</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chest-sweat"> Diaphoresis</label>
      <label><input type="checkbox" id="chest-nausea"> Nausea / vomiting</label>
      <label><input type="checkbox" id="chest-dyspnea"> Dyspnea</label>
      <label><input type="checkbox" id="chest-syncope"> Syncope</label>
    </div>
  </div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">2</span>Risk Factors & ECG</h2>
  <div class="field-row"><label>Risk factors</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chest-htn"> HTN</label>
      <label><input type="checkbox" id="chest-dm"> DM</label>
      <label><input type="checkbox" id="chest-hld"> HLD</label>
      <label><input type="checkbox" id="chest-smoke"> Smoking</label>
      <label><input type="checkbox" id="chest-fam"> Family history</label>
      <label><input type="checkbox" id="chest-prior"> Prior CAD / PCI / CABG</label>
    </div>
  </div>
  <div class="field-row"><label>ECG</label><textarea id="chest-ecg" placeholder="ST elevation/depression, T inversion, new LBBB"></textarea></div>
  <div class="field-row"><label>Troponin</label><input type="text" id="chest-trop"></div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">3</span>HEART Score</h2>
  <div class="inline-row">
    <div class="field-row"><label>History</label>
      <select id="heart-history">
        <option value="0">Slightly suspicious (0)</option>
        <option value="1">Moderately suspicious (1)</option>
        <option value="2">Highly suspicious (2)</option>
      </select>
    </div>
    <div class="field-row"><label>ECG</label>
      <select id="heart-ecg">
        <option value="0">Normal (0)</option>
        <option value="1">Non-specific repolarization (1)</option>
        <option value="2">Significant ST depression / elevation (2)</option>
      </select>
    </div>
    <div class="field-row"><label>Age</label>
      <select id="heart-age">
        <option value="0">&lt;45 (0)</option>
        <option value="1">45–64 (1)</option>
        <option value="2">≥65 (2)</option>
      </select>
    </div>
    <div class="field-row"><label>Risk factors</label>
      <select id="heart-rf">
        <option value="0">None (0)</option>
        <option value="1">1–2 (1)</option>
        <option value="2">≥3 or prior atherosclerosis (2)</option>
      </select>
    </div>
    <div class="field-row"><label>Troponin</label>
      <select id="heart-trop">
        <option value="0">≤ normal limit (0)</option>
        <option value="1">1–3× normal (1)</option>
        <option value="2">&gt;3× normal (2)</option>
      </select>
    </div>
  </div>
  <div class="score-box">HEART Score: <span class="score-val" id="heart-score">0</span> / 10 — <span id="heart-risk">low risk</span></div>
</div>
<div class="card">
  <h2 class="section-title"><span class="num">4</span>Plan</h2>
  <div class="field-row"><label>Disposition</label>
    <select id="chest-disp">
      <option value="">— select —</option>
      <option>Obs / serial troponin</option>
      <option>Cardiology consult / cath lab</option>
      <option>CT coronary / aortic imaging</option>
      <option>Discharge with OPD f/u</option>
    </select>
  </div>
  <div class="field-row"><label>Orders / meds</label><textarea id="chest-plan"></textarea></div>
</div>

</form>
</main>
<div class="action-bar">
  <button type="button" class="btn btn-secondary" id="copy-btn" onclick="copyNote()">📋 Copy Note</button>
  <button type="button" class="btn btn-danger" onclick="clearNote()">🗑 Clear</button>
  <button type="button" class="btn btn-primary" onclick="printNote()">🖨 Print</button>
</div>
<footer class="footer">Maharat Nakhon Ratchasima Hospital · Emergency Department · v21</footer>
<script src="er-note.js"></script>
<script>

function calcHeart(){
  let s=0;
  ['heart-history','heart-ecg','heart-age','heart-rf','heart-trop'].forEach(id=>{
    const el=document.getElementById(id); if(el) s+=parseInt(el.value,10)||0;
  });
  const scoreEl=document.getElementById('heart-score');
  const riskEl=document.getElementById('heart-risk');
  if(scoreEl) scoreEl.textContent=s;
  if(riskEl) riskEl.textContent=s>=7?'high risk (consider early invasive strategy)':s>=4?'moderate risk (observe, serial troponin)':'low risk (consider early discharge)';
}
['heart-history','heart-ecg','heart-age','heart-rf','heart-trop'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.addEventListener('change', calcHeart);
});
calcHeart();

</script>
</body>
</html>
